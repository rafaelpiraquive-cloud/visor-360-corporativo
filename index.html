<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 360 Corporativo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000; 
        }
        
        #panorama { 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Panel superior de filtros */
        #filter-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 16px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 140px;
        }

        select:focus { 
            border-color: #3b82f6; 
        }

        /* Galería inferior de botones */
        #gallery {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 30px;
            max-width: 90%;
            overflow-x: auto;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-photo {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-photo:hover { 
            background: #1d4ed8; 
            transform: translateY(-2px); 
        }
        
        .btn-photo.active { 
            background: #16a34a; 
        }
    </style>
</head>
<body>

    <!-- Panel de Selección de Filtros -->
    <div id="filter-panel">
        <div class="filter-group">
            <label for="select-nucleo">Núcleo</label>
            <select id="select-nucleo"><option value="">Todos los Núcleos</option></select>
        </div>
        <div class="filter-group">
            <label for="select-finca">Finca</label>
            <select id="select-finca"><option value="">Todas las Fincas</option></select>
        </div>
        <div class="filter-group">
            <label for="select-lote">Lote</label>
            <select id="select-lote"><option value="">Todos los Lotes</option></select>
        </div>
    </div>

    <!-- Contenedores del Visor 360 y Galería -->
    <div id="panorama"></div>
    <div id="gallery"></div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh321wbalb2EUtQVtTQRejkzuBF2fJM9nywoBYEQn8vdom5Bit53LJiZahdyZmAaiw21mpm0XJG-94/pub?gid=0&single=true&output=csv';

        const fotoPorDefault = "https://lh3.googleusercontent.com/d/1tOBYUDj-pyHrvCHgJ5bojWOs3kiUavO6=s0";

        let baseDatos = [];
        let viewer;

        function extraerIDDrive(urlDrive) {
            const match = urlDrive.match(/\/d\/([a-zA-Z0-9_-]+)/) || urlDrive.match(/id=([a-zA-Z0-9_-]+)/);
            return match && match[1] ? match[1] : null;
        }

        function obtenerURLLimpia(urlDrive) {
            const id = extraerIDDrive(urlDrive);
            return id ? `https://lh3.googleusercontent.com/d/${id}=s0` : urlDrive;
        }

        function cargarFoto(url) {
            if (viewer) viewer.destroy();
            viewer = pannellum.viewer('panorama', {
                "type": "equirectangular",
                "panorama": url,
                "autoLoad": true,
                "autoRotate": -0.5,
                "hfov": 100,
                "minHfov": 40,
                "maxHfov": 120,
                "crossOrigin": "anonymous"
            });
        }

        async function cargarBaseDatos() {
            try {
                const params = new URLSearchParams(window.location.search);
                const idFotoEspecifica = params.get('id');
                const modoLimpio = params.get('ui') === 'clean' || params.get('ui') === 'oculto';

                // Si viene activo el modo limpio/presentación, oculta controles
                if (modoLimpio) {
                    document.getElementById('filter-panel').style.display = 'none';
                    document.getElementById('gallery').style.display = 'none';
                }

                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                
                const filas = data.split('\n').slice(1);
                baseDatos = [];

                filas.forEach(fila => {
                    const col = fila.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                    if (col.length >= 5 && col[4]) {
                        baseDatos.push({
                            nucleo: col[0],
                            finca: col[1],
                            lote: col[2],
                            fecha: col[3],
                            idDrive: extraerIDDrive(col[4]),
                            url: obtenerURLLimpia(col[4])
                        });
                    }
                });

                if (!modoLimpio) {
                    poblarFiltroNucleos();
                    poblarFiltroFincas();
                    poblarFiltroLotes();
                }

                if (idFotoEspecifica) {
                    const fotoEncontrada = baseDatos.find(item => item.idDrive === idFotoEspecifica);
                    if (fotoEncontrada) {
                        cargarFoto(fotoEncontrada.url);
                        if (!modoLimpio) renderizarGaleria(baseDatos, false, fotoEncontrada.idDrive);
                    } else {
                        cargarFoto(`https://lh3.googleusercontent.com/d/${idFotoEspecifica}=s0`);
                        if (!modoLimpio) renderizarGaleria(baseDatos, false);
                    }
                } else {
                    cargarFoto(fotoPorDefault);
                    if (!modoLimpio) renderizarGaleria(baseDatos, false);
                }

            } catch (error) {
                console.error("Error al cargar la base de datos:", error);
            }
        }

        function poblarFiltroNucleos() {
            const selectNucleo = document.getElementById('select-nucleo');
            const nucleosUnicos = [...new Set(baseDatos.map(item => item.nucleo))].filter(Boolean);

            selectNucleo.innerHTML = '<option value="">Todos los Núcleos</option>';
            nucleosUnicos.forEach(n => {
                selectNucleo.innerHTML += `<option value="${n}">${n}</option>`;
            });
        }

        function poblarFiltroFincas() {
            const nucleoSel = document.getElementById('select-nucleo').value;
            const selectFinca = document.getElementById('select-finca');

            const fincasFiltradas = baseDatos
                .filter(item => !nucleoSel || item.nucleo === nucleoSel)
                .map(item => item.finca);

            const fincasUnicas = [...new Set(fincasFiltradas)].filter(Boolean);

            selectFinca.innerHTML = '<option value="">Todas las Fincas</option>';
            fincasUnicas.forEach(f => {
                selectFinca.innerHTML += `<option value="${f}">${f}</option>`;
            });
        }

        function poblarFiltroLotes() {
            const nucleoSel = document.getElementById('select-nucleo').value;
            const fincaSel = document.getElementById('select-finca').value;
            const selectLote = document.getElementById('select-lote');

            const lotesFiltrados = baseDatos
                .filter(item => (!nucleoSel || item.nucleo === nucleoSel) && (!fincaSel || item.finca === fincaSel))
                .map(item => item.lote);

            const lotesUnicos = [...new Set(lotesFiltrados)].filter(Boolean);

            selectLote.innerHTML = '<option value="">Todos los Lotes</option>';
            lotesUnicos.forEach(l => {
                selectLote.innerHTML += `<option value="${l}">${l}</option>`;
            });
        }

        document.getElementById('select-nucleo').addEventListener('change', function() {
            poblarFiltroFincas();
            poblarFiltroLotes();
            filtrarYRenderizar();
        });

        document.getElementById('select-finca').addEventListener('change', function() {
            poblarFiltroLotes();
            filtrarYRenderizar();
        });

        document.getElementById('select-lote').addEventListener('change', function() {
            filtrarYRenderizar();
        });

        function filtrarYRenderizar() {
            const nucleoSel = document.getElementById('select-nucleo').value;
            const fincaSel = document.getElementById('select-finca').value;
            const loteSel = document.getElementById('select-lote').value;

            const resultados = baseDatos.filter(item => {
                return (!nucleoSel || item.nucleo === nucleoSel) &&
                       (!fincaSel || item.finca === fincaSel) &&
                       (!loteSel || item.lote === loteSel);
            });

            renderizarGaleria(resultados, false);
        }

        function renderizarGaleria(lista, autocargarFoto = false, idActivo = null) {
            const container = document.getElementById('gallery');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<span style="color:white; font-size:13px; font-weight:600;">No hay registros con este filtro.</span>';
                return;
            }

            if (autocargarFoto && lista.length > 0) {
                cargarFoto(lista[0].url);
            }

            lista.forEach((item, idx) => {
                const btn = document.createElement('button');
                const esActivo = idActivo ? (item.idDrive === idActivo) : (autocargarFoto && idx === 0);
                btn.className = 'btn-photo' + (esActivo ? ' active' : '');
                btn.innerText = `${item.lote} (${item.fecha})`;
                btn.onclick = (e) => {
                    document.querySelectorAll('.btn-photo').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    cargarFoto(item.url);
                };
                container.appendChild(btn);
            });
        }

        cargarBaseDatos();
    </script>
</body>
</html>
